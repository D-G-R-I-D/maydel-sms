version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule: { interval: weekly }
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: monthly }
