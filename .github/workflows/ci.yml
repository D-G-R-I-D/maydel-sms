name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - run: dotnet tool restore
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # Unit + integration tests; Testcontainers uses the runner's Docker.
      - run: dotnet test --no-build -c Release --logger "trx" --results-directory ../TestResults
      - name: OpenAPI contract is committed and current
        run: git diff --exit-code -- ../contracts/openapi.json || (echo "::error::contracts/openapi.json is stale. Build locally and commit it." && exit 1)
      - name: No model changes without a migration
        run: dotnet ef migrations has-pending-model-changes -p src/Maydel.Infrastructure -s src/Maydel.Api
        env:
          ConnectionStrings__Default: Host=localhost;Database=ci;Username=ci;Password=ci
      - name: No known-vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: TestResults

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Skips every step until frontend/ exists (hashFiles isn't allowed in a job-level `if`).
      - id: detect
        run: echo "present=$([ -f frontend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm ci
      - name: Generated API types match the committed contract
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run api:types && git diff --exit-code -- src/lib/api/schema.d.ts
      - if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint
      - if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run typecheck
      - if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm test
      - if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks lists the PR's commits on pull_request events
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
